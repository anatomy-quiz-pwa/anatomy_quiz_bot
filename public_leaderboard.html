<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>解剖學測驗機器人 - 即時排行榜</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #F4E8D8;
            background-image: 
                repeating-linear-gradient(
                  0deg,
                  transparent,
                  transparent 2px,
                  rgba(28, 28, 28, 0.02) 2px,
                  rgba(28, 28, 28, 0.02) 4px
                ),
                repeating-linear-gradient(
                  90deg,
                  transparent,
                  transparent 2px,
                  rgba(28, 28, 28, 0.02) 2px,
                  rgba(28, 28, 28, 0.02) 4px
                );
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: #1C1C1C;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #1C1C1C;
            text-shadow: 2px 2px 0 #C57B57;
            letter-spacing: 0.05em;
        }

        .header p {
            font-size: 1.2rem;
            color: #1C1C1C;
            opacity: 0.85;
            margin-bottom: 20px;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: #fffaf5;
            padding: 15px 25px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid #1C1C1C;
            box-shadow: 4px 4px 0 #1C1C1C;
        }

        .stat-item .value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #1C1C1C;
            text-shadow: 1px 1px 0 #C57B57;
        }

        .stat-item .label {
            font-size: 0.9rem;
            color: #1C1C1C;
            opacity: 0.8;
            margin-top: 5px;
        }

        .period-selector {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            gap: 10px;
        }

        .period-btn {
            padding: 12px 24px;
            border: 2px solid #1C1C1C;
            border-radius: 8px;
            background: #fffaf5;
            color: #1C1C1C;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            font-weight: 500;
            box-shadow: 3px 3px 0 #1C1C1C;
        }

        .period-btn:hover {
            background: #C57B57;
            color: #fffaf5;
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 #1C1C1C;
        }

        .period-btn.active {
            background: #B85C38;
            color: #fffaf5;
            font-weight: bold;
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 #1C1C1C;
        }

        .leaderboard-card {
            background: #fffaf5;
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid #1C1C1C;
            box-shadow: 8px 8px 0 #1C1C1C;
        }

        .leaderboard-header {
            background: #C57B57;
            color: #fffaf5;
            padding: 25px;
            text-align: center;
            border-bottom: 3px solid #1C1C1C;
        }

        .leaderboard-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
        }

        .last-updated {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
        }

        .leaderboard-table th {
            background: #F4E8D8;
            padding: 20px 15px;
            text-align: left;
            font-weight: 600;
            color: #1C1C1C;
            border-bottom: 2px solid #1C1C1C;
        }

        .leaderboard-table td {
            padding: 20px 15px;
            border-bottom: 1px solid #1C1C1C;
            transition: all 0.3s ease;
            color: #1C1C1C;
        }

        .leaderboard-table tr:hover {
            background-color: #F4E8D8;
        }

        .rank {
            font-weight: bold;
            font-size: 1.2rem;
            width: 80px;
            text-align: center;
        }

        .rank-1 { 
            color: #B85C38;
            text-shadow: 1px 1px 0 #1C1C1C;
        }
        .rank-2 { 
            color: #C57B57;
            text-shadow: 1px 1px 0 #1C1C1C;
        }
        .rank-3 { 
            color: #1C1C1C;
            text-shadow: 1px 1px 0 #C57B57;
        }

        .player-name {
            font-weight: 600;
            color: #1C1C1C;
            font-size: 1.1rem;
        }

        .score {
            font-weight: bold;
            color: #B85C38;
            font-size: 1.1rem;
        }

        .level {
            background: #B85C38;
            color: #fffaf5;
            padding: 5px 12px;
            border-radius: 15px;
            border: 2px solid #1C1C1C;
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: 2px 2px 0 #1C1C1C;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            text-align: center;
            padding: 40px 20px;
            color: #dc3545;
            background: rgba(220, 53, 69, 0.1);
            border-radius: 10px;
            margin: 20px;
        }

        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            cursor: pointer;
            font-size: 1.5rem;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .auto-refresh {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .stats-bar {
                gap: 15px;
            }
            
            .stat-item {
                padding: 10px 15px;
                min-width: 120px;
            }
            
            .leaderboard-table th,
            .leaderboard-table td {
                padding: 15px 10px;
                font-size: 0.9rem;
            }
            
            .period-selector {
                flex-wrap: wrap;
            }
        }

        .trophy {
            display: inline-block;
            margin-right: 8px;
        }

        .medal-icon {
            font-size: 1.5rem;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 解剖學測驗機器人</h1>
            <p>即時排行榜 - 挑戰你的解剖學知識！</p>
            <div class="auto-refresh">
                <span id="autoRefreshStatus">自動更新：每30秒</span>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-item">
                <div class="value" id="totalPlayers">-</div>
                <div class="label">活躍玩家</div>
            </div>
            <div class="stat-item">
                <div class="value" id="todayAnswers">-</div>
                <div class="label">今日答題</div>
            </div>
            <div class="stat-item">
                <div class="value" id="accuracy">-</div>
                <div class="label">平均正確率</div>
            </div>
            <div class="stat-item">
                <div class="value" id="maxStreak">-</div>
                <div class="label">最高連勝</div>
            </div>
        </div>

        <div class="period-selector">
            <button class="period-btn active" data-period="week">本週</button>
            <button class="period-btn" data-period="month">本月</button>
            <button class="period-btn" data-period="all">全部</button>
        </div>

        <div class="leaderboard-card">
            <div class="leaderboard-header">
                <h2><span class="trophy">🏆</span>排行榜</h2>
                <div class="last-updated">最後更新：<span id="lastUpdated">載入中...</span></div>
            </div>
            
            <div id="leaderboardContent">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>正在載入排行榜資料...</p>
                </div>
            </div>
        </div>

        <button class="refresh-btn" onclick="refreshData()" title="手動更新">
            🔄
        </button>
    </div>

    <script>
        let currentPeriod = 'week';
        let autoRefreshInterval;

        // API 基礎 URL - 請根據實際部署調整
        const API_BASE_URL = window.location.origin;

        async function fetchLeaderboardData(period = 'week') {
            try {
                const response = await fetch(`${API_BASE_URL}/api/leaderboard?period=${period}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return await response.json();
            } catch (error) {
                console.error('獲取排行榜資料失敗:', error);
                throw error;
            }
        }

        async function fetchDashboardData() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/dashboard`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return await response.json();
            } catch (error) {
                console.error('獲取儀表板資料失敗:', error);
                throw error;
            }
        }

        function updateStats(dashboardData) {
            document.getElementById('totalPlayers').textContent = dashboardData.activeStudents || 0;
            document.getElementById('todayAnswers').textContent = dashboardData.answersToday || 0;
            document.getElementById('accuracy').textContent = 
                Math.round((dashboardData.accuracy || 0) * 100) + '%';
            document.getElementById('maxStreak').textContent = dashboardData.maxStreak || 0;
        }

        function renderLeaderboard(data) {
            const content = document.getElementById('leaderboardContent');
            
            if (!data || data.length === 0) {
                content.innerHTML = `
                    <div class="error">
                        <h3>暫無排行榜資料</h3>
                        <p>目前還沒有玩家資料，快來挑戰解剖學測驗吧！</p>
                    </div>
                `;
                return;
            }

            let tableHTML = `
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>排名</th>
                            <th>玩家</th>
                            <th>等級</th>
                            <th>答題數</th>
                            <th>分數</th>
                            <th>連勝</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            data.forEach((player, index) => {
                const rank = index + 1;
                let rankClass = '';
                let medalIcon = '';
                
                if (rank === 1) {
                    rankClass = 'rank-1';
                    medalIcon = '🥇';
                } else if (rank === 2) {
                    rankClass = 'rank-2';
                    medalIcon = '🥈';
                } else if (rank === 3) {
                    rankClass = 'rank-3';
                    medalIcon = '🥉';
                }

                tableHTML += `
                    <tr>
                        <td class="rank ${rankClass}">
                            <span class="medal-icon">${medalIcon}</span>
                            ${rank}
                        </td>
                        <td class="player-name">${player.name || '匿名玩家'}</td>
                        <td><span class="level">Lv.${player.level || 1}</span></td>
                        <td>${player.answers || 0}</td>
                        <td class="score">${player.score || 0}</td>
                        <td>${player.streak || 0}</td>
                    </tr>
                `;
            });

            tableHTML += '</tbody></table>';
            content.innerHTML = tableHTML;
        }

        function showError(message) {
            const content = document.getElementById('leaderboardContent');
            content.innerHTML = `
                <div class="error">
                    <h3>載入失敗</h3>
                    <p>${message}</p>
                    <button onclick="refreshData()" style="margin-top: 15px; padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer;">
                        重新載入
                    </button>
                </div>
            `;
        }

        function updateLastUpdated() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('zh-TW', { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit' 
            });
            document.getElementById('lastUpdated').textContent = timeString;
        }

        async function refreshData() {
            try {
                // 顯示載入狀態
                document.getElementById('leaderboardContent').innerHTML = `
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        <p>正在更新資料...</p>
                    </div>
                `;

                // 並行獲取資料
                const [leaderboardData, dashboardData] = await Promise.all([
                    fetchLeaderboardData(currentPeriod),
                    fetchDashboardData()
                ]);

                // 更新統計資料
                updateStats(dashboardData);
                
                // 更新排行榜
                renderLeaderboard(leaderboardData);
                
                // 更新時間
                updateLastUpdated();

            } catch (error) {
                console.error('更新資料失敗:', error);
                showError('無法連接到伺服器，請稍後再試。');
            }
        }

        function setupPeriodSelector() {
            const buttons = document.querySelectorAll('.period-btn');
            buttons.forEach(button => {
                button.addEventListener('click', async () => {
                    // 更新按鈕狀態
                    buttons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    
                    // 更新當前期間
                    currentPeriod = button.dataset.period;
                    
                    // 重新載入資料
                    await refreshData();
                });
            });
        }

        function startAutoRefresh() {
            // 清除現有的定時器
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
            }
            
            // 設定自動更新（每30秒）
            autoRefreshInterval = setInterval(refreshData, 30000);
            
            // 更新狀態顯示
            document.getElementById('autoRefreshStatus').textContent = '自動更新：每30秒';
        }

        // 頁面載入完成後初始化
        document.addEventListener('DOMContentLoaded', async () => {
            setupPeriodSelector();
            await refreshData();
            startAutoRefresh();
        });

        // 頁面可見性變化時處理自動更新
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                // 頁面隱藏時停止自動更新
                if (autoRefreshInterval) {
                    clearInterval(autoRefreshInterval);
                }
            } else {
                // 頁面顯示時重新開始自動更新
                refreshData();
                startAutoRefresh();
            }
        });
    </script>
</body>
</html>
