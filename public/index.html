<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>解剖咬一口 Anatomy Bite - 遊戲化問答系統</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- External CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Brand Theme - Inline for better compatibility -->
    <style>
/* === Anatomy Bite 品牌主題 === */

:root {
  /* 品牌色彩 */
  --brand-bg: #F4E8D8;
  --brand-dark: #1C1C1C;
  --brand-accent: #C57B57;
  --brand-warm: #B85C38;
  --brand-light: #fffaf5;
  
  /* 品牌字體 */
  --brand-font-en: 'Playfair Display', serif;
  --brand-font-zh: 'Noto Sans TC', sans-serif;
  
  /* 陰影效果 */
  --shadow-soft: 4px 4px 8px rgba(28, 28, 28, 0.15);
  --shadow-hover: 7px 7px 12px rgba(28, 28, 28, 0.2);
}

/* 強制覆蓋所有背景樣式 */
html, body {
  background-color: #F4E8D8 !important;
  background-image: 
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(28, 28, 28, 0.02) 2px,
      rgba(28, 28, 28, 0.02) 4px
    ),
    repeating-linear-gradient(
      90deg,
      transparent,
      transparent 2px,
      rgba(28, 28, 28, 0.02) 2px,
      rgba(28, 28, 28, 0.02) 4px
    ) !important;
  background-size: 100% 100% !important;
  background-attachment: fixed !important;
  color: #1C1C1C !important;
  font-family: 'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif !important;
  min-height: 100vh !important;
  margin: 0 !important;
  padding: 20px !important;
}

/* 標題字體使用英文品牌字體 */
h1, h2, h3, h4, h5, h6 {
  font-family: var(--brand-font-en) !important;
  letter-spacing: 0.05em;
  color: var(--brand-dark);
}

/* 遊戲容器 - 美式復古風格 */
.game-container {
  max-width: 900px !important;
  margin: 0 auto !important;
  background: #fffaf5 !important;
  border: 3px solid #1C1C1C !important;
  box-shadow: 8px 8px 0 #1C1C1C !important;
  border-radius: 16px !important;
  overflow: hidden !important;
}

/* 遊戲標題區 */
.game-header {
  background: #C57B57 !important;
  color: #fffaf5 !important;
  border-bottom: 3px solid #1C1C1C !important;
  padding: 30px !important;
  text-align: center;
}

/* 遊戲內容區域 */
.game-content {
  padding: 40px !important;
}

/* 開始畫面 */
#start-screen {
  text-align: center !important;
  padding: 60px 40px !important;
}

/* 載入畫面 */
.loading {
  text-align: center !important;
  padding: 60px !important;
}

/* 遊戲畫面 */
#game-screen {
  display: none !important;
}

.game-header h1 {
  color: #fffaf5 !important;
  text-shadow: 2px 2px 0 #1C1C1C !important;
  font-weight: 700;
  margin: 0 !important;
  font-size: 2.5rem !important;
}

.game-header p {
  color: #fffaf5 !important;
  opacity: 0.95;
}

/* 統計欄 - 骨色與深色對比 */
.stats-bar {
  display: flex !important;
  justify-content: space-around !important;
  background: #B85C38 !important;
  color: #fffaf5 !important;
  border-bottom: 3px solid #1C1C1C !important;
  padding: 20px !important;
  margin: 0 !important;
}

.stat-item {
  text-align: center;
}

.stat-value {
  font-size: 2rem;
  font-weight: bold;
  color: #fffaf5 !important;
  text-shadow: 1px 1px 0 #1C1C1C;
  display: block !important;
}

.stat-label {
  color: #fffaf5 !important;
  font-size: 0.9rem;
  opacity: 0.9;
}

/* 卡片樣式 - 黑線條與陰影 */
.card, .feature-card, .question-card {
  background: #fffaf5 !important;
  border: 2px solid #1C1C1C !important;
  box-shadow: 4px 4px 0 #1C1C1C !important;
  border-radius: 12px !important;
  padding: 2rem !important;
  transition: all 0.3s ease;
  margin: 20px 0 !important;
}

.card:hover, .feature-card:hover {
  transform: translate(-2px, -2px);
  box-shadow: 6px 6px 0 var(--brand-dark) !important;
}

/* 按鈕樣式 - 美式復古手繪風 */
button, .action-btn, .btn-primary-custom {
  background-color: #C57B57 !important;
  color: #fffaf5 !important;
  border: 2px solid #1C1C1C !important;
  border-radius: 8px !important;
  font-weight: bold;
  padding: 15px 40px !important;
  font-size: 1.2rem !important;
  cursor: pointer !important;
  pointer-events: auto !important;
  transition: all 0.2s ease;
  box-shadow: 3px 3px 0 #1C1C1C !important;
  font-family: 'Noto Sans TC', sans-serif !important;
}

button:hover, .action-btn:hover, .btn-primary-custom:hover {
  background-color: #B85C38 !important;
  transform: translate(-2px, -2px) !important;
  box-shadow: 5px 5px 0 #1C1C1C !important;
  color: #fffaf5 !important;
}

button:active {
  transform: translate(1px, 1px) !important;
  box-shadow: 2px 2px 0 #1C1C1C !important;
}

/* 選項按鈕 */
.option-btn {
  width: 100% !important;
  padding: 20px !important;
  margin: 10px 0 !important;
  background: #fffaf5 !important;
  border: 2px solid #1C1C1C !important;
  border-radius: 15px !important;
  color: #1C1C1C !important;
  text-align: left !important;
  font-size: 1.1rem !important;
  font-weight: 500 !important;
  box-shadow: 3px 3px 0 #1C1C1C !important;
  transition: all 0.3s ease;
  cursor: pointer !important;
  position: relative !important;
}

.option-btn:hover {
  background: #F4E8D8 !important;
  transform: translate(-2px, -2px) !important;
  box-shadow: 5px 5px 0 #1C1C1C !important;
}

.option-btn.selected {
  background: #C57B57 !important;
  color: #fffaf5 !important;
  transform: translate(-2px, -2px) !important;
  box-shadow: 5px 5px 0 #1C1C1C !important;
}

.option-btn.correct {
  background: #88B04B !important;
  color: #fffaf5 !important;
  border-color: #1C1C1C !important;
}

.option-btn.wrong {
  background: #DC3545 !important;
  color: #fffaf5 !important;
  border-color: #1C1C1C !important;
}

/* Logo 樣式 */
.logo {
  filter: contrast(110%) saturate(95%);
  width: 120px;
  margin: 0 auto;
  display: block;
  border: 2px solid var(--brand-dark);
  border-radius: 50%;
  box-shadow: 3px 3px 0 var(--brand-dark);
}

/* 等級徽章 */
.level-badge {
  background: var(--brand-warm) !important;
  color: var(--brand-light) !important;
  border: 2px solid var(--brand-dark) !important;
  box-shadow: 2px 2px 0 var(--brand-dark) !important;
  padding: 8px 16px !important;
  border-radius: 20px !important;
  font-weight: bold;
}

/* 進度條 */
.progress-bar-custom {
  background: var(--brand-bg) !important;
  border: 2px solid var(--brand-dark) !important;
  border-radius: 15px !important;
  overflow: hidden;
  box-shadow: inset 2px 2px 4px rgba(28, 28, 28, 0.1);
}

.progress-fill {
  background: linear-gradient(90deg, var(--brand-warm), var(--brand-accent)) !important;
  color: var(--brand-light) !important;
  text-shadow: 1px 1px 0 var(--brand-dark);
}

/* 解釋框 */
.explanation-box {
  background: var(--brand-bg) !important;
  border-left: 5px solid var(--brand-warm) !important;
  border: 2px solid var(--brand-dark) !important;
  border-left-width: 5px !important;
  padding: 20px !important;
  border-radius: 10px !important;
  box-shadow: 3px 3px 0 var(--brand-dark) !important;
}

.explanation-box h5 {
  color: var(--brand-dark);
}

/* 載入動畫 */
.spinner {
  border: 5px solid var(--brand-bg) !important;
  border-top: 5px solid var(--brand-accent) !important;
  border-radius: 50%;
}

/* 結果彈窗 */
.result-modal {
  background: rgba(28, 28, 28, 0.85) !important;
}

.result-content {
  background: var(--brand-light) !important;
  border: 3px solid var(--brand-dark) !important;
  box-shadow: 8px 8px 0 var(--brand-dark) !important;
  color: var(--brand-dark);
}

/* Bootstrap 元件覆蓋 */
.badge {
  border: 1px solid var(--brand-dark) !important;
  font-family: var(--brand-font-zh) !important;
}

.alert {
  border: 2px solid var(--brand-dark) !important;
  box-shadow: 3px 3px 0 var(--brand-dark) !important;
  background: var(--brand-bg) !important;
  color: var(--brand-dark) !important;
}

/* 輸入框樣式 */
.form-control {
  border: 2px solid var(--brand-dark) !important;
  border-radius: 8px !important;
  background: var(--brand-light) !important;
  color: var(--brand-dark) !important;
  padding: 0.75rem !important;
  font-family: var(--brand-font-zh) !important;
}

.form-control:focus {
  border-color: var(--brand-accent) !important;
  box-shadow: 0 0 0 0.2rem rgba(197, 123, 87, 0.25) !important;
  outline: none;
}

/* Icon 顏色調整 */
.fa, .fas, .fab {
  color: inherit;
}

.text-warning {
  color: var(--brand-warm) !important;
}

.text-success {
  color: #88B04B !important;
}

.text-primary {
  color: var(--brand-accent) !important;
}

/* 響應式調整 */
@media (max-width: 768px) {
  .game-container {
    border-width: 2px !important;
    box-shadow: 4px 4px 0 var(--brand-dark) !important;
  }
  
  button, .action-btn {
    padding: 0.6rem 1.2rem !important;
  }
  
  .option-btn:hover,
  .option-btn.selected {
    transform: none !important;
    box-shadow: 3px 3px 0 var(--brand-dark) !important;
  }
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- LINE Login SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

</head>
<body>
    <div class="game-container">
        <!-- 遊戲標題 -->
        <div class="game-header">
            <h1><i class="fas fa-brain"></i> 解剖咬一口 Anatomy Bite</h1>
            <p class="mb-0">每天學一點解剖、咬一口文獻！</p>
        </div>

        <!-- 統計欄 -->
        <div class="stats-bar" id="stats-bar" style="display: none;">
            <div class="stat-item">
                <span class="stat-value" id="stat-score">0</span>
                <span class="stat-label">總分</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="stat-level">1</span>
                <span class="stat-label">等級</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="stat-correct">0/0</span>
                <span class="stat-label">答對率</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="stat-streak">0</span>
                <span class="stat-label">連續答對</span>
            </div>
        </div>

        <!-- 遊戲內容 -->
        <div class="game-content">
            <!-- 開始畫面 -->
            <div id="start-screen">
                <div class="feature-card">
                    <div class="text-center mb-4">
                        <img src="https://ciqlfqfgzqqgdrogedxg.supabase.co/storage/v1/object/public/linebot/opening.png" 
                             alt="解剖咬一口開場圖片" 
                             style="max-width: 300px; height: auto; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);">
                    </div>
                    
                    <div class="row mb-4">
                        <div class="col-md-4 mb-3">
                            <i class="fas fa-bolt fa-3x text-warning mb-3"></i>
                            <h5>即時回饋</h5>
                            <p class="text-muted">答題後立即知道結果</p>
                        </div>
                        <div class="col-md-4 mb-3">
                            <i class="fas fa-trophy fa-3x text-success mb-3"></i>
                            <h5>遊戲化學習</h5>
                            <p class="text-muted">14個等級等你挑戰</p>
                        </div>
                        <div class="col-md-4 mb-3">
                            <i class="fas fa-chart-line fa-3x text-primary mb-3"></i>
                            <h5>進度追蹤</h5>
                            <p class="text-muted">實時查看你的學習成果</p>
                        </div>
                    </div>

                    <!-- LINE 登录区域 -->
                    <div id="login-section" class="mb-4">
                        <div class="mb-3">
                            <button id="line-login-btn" class="action-btn btn-success" style="background: linear-gradient(135deg, #00C300, #00A000); pointer-events: auto; cursor: pointer;" onclick="lineLogin()">
                                <i class="fab fa-line"></i> 使用 LINE 登入
                            </button>
                            <!-- 測試按鈕 -->
                            <button onclick="testLineLogin()" class="btn btn-sm btn-outline-info ms-2">
                                🧪 測試
                            </button>
                        </div>
                        <p class="text-muted small">或</p>
                    </div>
                    
                    <!-- 手动输入昵称区域 -->
                    <div id="manual-login-section" class="mb-4" style="display: none;">
                        <div class="mb-4">
                            <input type="text" id="nickname-input" class="form-control form-control-lg" 
                                   placeholder="請輸入你的暱稱（選填）" maxlength="20">
                        </div>
                    </div>
                    
                    <!-- 用户信息显示 -->
                    <div id="user-info" class="mb-4" style="display: none;">
                        <div class="alert alert-info">
                            <i class="fas fa-user"></i>
                            <span id="user-display-name"></span>
                            <button id="logout-btn" class="btn btn-sm btn-outline-secondary ms-2">
                                <i class="fas fa-sign-out-alt"></i> 登出
                            </button>
                        </div>
                    </div>

                    <button id="start-btn" class="action-btn btn-primary-custom" onclick="startGame()" style="display: none;">
                        <i class="fas fa-play"></i> 開始遊戲
                    </button>
                </div>
            </div>

            <!-- 載入中 -->
            <div id="loading-screen" class="loading" style="display: none;">
                <div class="spinner"></div>
                <h4>正在載入題目...</h4>
            </div>

            <!-- 遊戲畫面 -->
            <div id="game-screen" style="display: none;">
                <!-- 進度條 -->
                <div class="progress-bar-custom">
                    <div class="progress-fill" id="progress-bar" style="width: 0%">
                        <span id="progress-text">0%</span>
                    </div>
                </div>

                <!-- 題目卡片 -->
                <div class="question-card">
                    <div class="mb-3">
                        <span class="level-badge" id="question-level">等級 1</span>
                        <span class="badge bg-info ms-2" id="question-category">類別</span>
                    </div>
                    <div class="question-text" id="question-text">題目載入中...</div>
                    <div id="options-container"></div>
                </div>

                <!-- 解釋區域 -->
                <div id="explanation-area" style="display: none;">
                    <div class="explanation-box">
                        <h5><i class="fas fa-lightbulb text-warning"></i> 詳細解釋</h5>
                        <p id="explanation-text"></p>
                    </div>
                </div>

                <!-- 按鈕區 -->
                <div class="text-center mt-4">
                    <button class="action-btn btn-primary-custom" id="submit-btn" 
                            onclick="submitAnswer()" disabled>
                        <i class="fas fa-check"></i> 提交答案
                    </button>
                    <button class="action-btn btn-primary-custom" id="next-btn" 
                            onclick="nextQuestion()" style="display: none;">
                        <i class="fas fa-forward"></i> 下一題
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 結果彈窗 -->
    <div class="result-modal" id="result-modal">
        <div class="result-content">
            <div id="result-icon"></div>
            <h2 id="result-title"></h2>
            <p id="result-message"></p>
            <div id="result-stats"></div>
        </div>
    </div>

    <script src="/public/game.js"></script>
    
    <!-- 內聯修復 LINE 登入按鈕 -->
    <script>
        // 確保 LINE 登入函數存在
        window.lineLogin = function() {
            console.log('🖱️ LINE 登入按鈕被點擊');
            alert('LINE 登入功能已觸發！\n\n這表示按鈕現在可以正常點擊了。\n\n接下來會顯示暱稱輸入界面...');
            
            // 顯示暱稱輸入界面
            showNicknameInput();
        };
        
        window.testLineLogin = function() {
            console.log('🧪 測試 LINE 登入');
            alert('測試功能已觸發！按鈕可以正常點擊。');
        };
        
        // 遊戲狀態
        let gameState = {
            currentLevel: 1,
            score: 0,
            correctAnswers: 0,
            totalAnswers: 0,
            currentQuestion: null,
            selectedAnswer: null
        };

        // 示例題目數據
        const sampleQuestions = [
            {
                id: 1,
                level: 1,
                category: "解剖學基礎",
                question: "人體有多少塊骨頭？",
                options: ["206塊", "208塊", "204塊", "210塊"],
                correct_answer: 0,
                explanation: "成人人體共有206塊骨頭，這些骨頭組成了人體的骨骼系統。"
            },
            {
                id: 2,
                level: 1,
                category: "解剖學基礎", 
                question: "人體最大的器官是什麼？",
                options: ["心臟", "肝臟", "皮膚", "肺"],
                correct_answer: 2,
                explanation: "皮膚是人體最大的器官，成年人的皮膚總面積約為1.5-2平方米。"
            },
            {
                id: 3,
                level: 1,
                category: "解剖學基礎",
                question: "人體有多少個心腔？",
                options: ["2個", "3個", "4個", "5個"],
                correct_answer: 2,
                explanation: "人體心臟有4個心腔：左心房、右心房、左心室、右心室。"
            }
        ];

        // 開始遊戲函數
        window.startGame = function() {
            console.log('🎮 開始遊戲按鈕被點擊');
            
            // 獲取暱稱
            const nicknameInput = document.getElementById('nickname-input');
            const nickname = nicknameInput ? nicknameInput.value.trim() : '遊客';
            
            console.log('玩家暱稱：', nickname);
            
            // 隱藏開始畫面，顯示載入中
            const startScreen = document.getElementById('start-screen');
            const loadingScreen = document.getElementById('loading-screen');
            const gameScreen = document.getElementById('game-screen');
            
            if (startScreen) startScreen.style.display = 'none';
            if (loadingScreen) {
                loadingScreen.style.display = 'block';
                
                // 模擬載入過程
                setTimeout(() => {
                    if (loadingScreen) loadingScreen.style.display = 'none';
                    if (gameScreen) {
                        gameScreen.style.display = 'block';
                        // 顯示統計欄
                        const statsBar = document.getElementById('stats-bar');
                        if (statsBar) statsBar.style.display = 'flex';
                        
                        // 載入第一題
                        loadQuestion();
                    }
                }, 2000);
            }
        };

        // 載入題目函數
        function loadQuestion() {
            console.log('📚 載入題目');
            
            // 隨機選擇一題
            const randomIndex = Math.floor(Math.random() * sampleQuestions.length);
            gameState.currentQuestion = sampleQuestions[randomIndex];
            
            // 顯示題目
            displayQuestion();
        }

        // 顯示題目函數
        function displayQuestion() {
            const question = gameState.currentQuestion;
            if (!question) {
                console.error('沒有題目可以顯示');
                return;
            }

            console.log('顯示題目：', question.question);

            // 更新等級和類別
            const levelElement = document.getElementById('question-level');
            const categoryElement = document.getElementById('question-category');
            const questionTextElement = document.getElementById('question-text');
            const optionsContainer = document.getElementById('options-container');

            if (levelElement) levelElement.textContent = `等級 ${question.level}`;
            if (categoryElement) categoryElement.textContent = question.category;
            if (questionTextElement) questionTextElement.textContent = question.question;

            // 清空選項容器
            if (optionsContainer) {
                optionsContainer.innerHTML = '';
                
                // 創建選項按鈕
                question.options.forEach((option, index) => {
                    const button = document.createElement('button');
                    button.className = 'option-btn';
                    button.textContent = `${String.fromCharCode(65 + index)}. ${option}`;
                    button.onclick = () => selectAnswer(index);
                    button.id = `option-${index}`;
                    optionsContainer.appendChild(button);
                });
            }

            // 重置選擇狀態
            gameState.selectedAnswer = null;
            
            // 啟用提交按鈕
            const submitBtn = document.getElementById('submit-btn');
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.style.display = 'inline-block';
            }

            // 隱藏下一題按鈕
            const nextBtn = document.getElementById('next-btn');
            if (nextBtn) {
                nextBtn.style.display = 'none';
            }

            // 隱藏解釋區域
            const explanationArea = document.getElementById('explanation-area');
            if (explanationArea) {
                explanationArea.style.display = 'none';
            }
        }

        // 選擇答案函數
        function selectAnswer(index) {
            console.log('選擇答案：', index);
            
            // 移除所有選中狀態
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            
            // 添加選中狀態
            const selectedBtn = document.getElementById(`option-${index}`);
            if (selectedBtn) {
                selectedBtn.classList.add('selected');
                gameState.selectedAnswer = index;
                
                // 啟用提交按鈕
                const submitBtn = document.getElementById('submit-btn');
                if (submitBtn) {
                    submitBtn.disabled = false;
                }
            }
        }
        
        // 提交答案函數
        window.submitAnswer = function() {
            if (gameState.selectedAnswer === null) {
                alert('請先選擇一個答案！');
                return;
            }

            const question = gameState.currentQuestion;
            const isCorrect = gameState.selectedAnswer === question.correct_answer;
            
            console.log('提交答案：', gameState.selectedAnswer, '正確答案：', question.correct_answer, '是否正確：', isCorrect);

            // 禁用所有選項
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.disabled = true;
            });

            // 顯示正確/錯誤狀態
            document.querySelectorAll('.option-btn').forEach((btn, index) => {
                if (index === question.correct_answer) {
                    btn.classList.add('correct');
                } else if (index === gameState.selectedAnswer && !isCorrect) {
                    btn.classList.add('wrong');
                }
            });

            // 更新統計
            gameState.totalAnswers++;
            if (isCorrect) {
                gameState.correctAnswers++;
                gameState.score += 10;
                alert('🎉 答對了！獲得10分！');
            } else {
                alert('😢 答錯了！正確答案是：' + question.options[question.correct_answer]);
            }

            // 更新統計顯示
            updateStats();

            // 顯示解釋
            const explanationArea = document.getElementById('explanation-area');
            const explanationText = document.getElementById('explanation-text');
            if (explanationArea && explanationText) {
                explanationText.textContent = question.explanation;
                explanationArea.style.display = 'block';
            }

            // 隱藏提交按鈕，顯示下一題按鈕
            const submitBtn = document.getElementById('submit-btn');
            const nextBtn = document.getElementById('next-btn');
            if (submitBtn) submitBtn.style.display = 'none';
            if (nextBtn) nextBtn.style.display = 'inline-block';
        };
        
        // 下一題函數
        window.nextQuestion = function() {
            console.log('➡️ 下一題按鈕被點擊');
            
            // 載入下一題
            loadQuestion();
        };

        // 更新統計顯示
        function updateStats() {
            const scoreElement = document.getElementById('stat-score');
            const levelElement = document.getElementById('stat-level');
            const correctElement = document.getElementById('stat-correct');
            const streakElement = document.getElementById('stat-streak');

            if (scoreElement) scoreElement.textContent = gameState.score;
            if (levelElement) levelElement.textContent = gameState.currentLevel;
            if (correctElement) {
                const accuracy = gameState.totalAnswers > 0 
                    ? Math.round((gameState.correctAnswers / gameState.totalAnswers) * 100)
                    : 0;
                correctElement.textContent = `${gameState.correctAnswers}/${gameState.totalAnswers} (${accuracy}%)`;
            }
            if (streakElement) streakElement.textContent = gameState.correctAnswers; // 簡化顯示
        }
        
        function showNicknameInput() {
            // 隱藏登入按鈕
            const loginSection = document.getElementById('login-section');
            if (loginSection) {
                loginSection.style.display = 'none';
            }
            
            // 顯示手動登入區域
            const manualSection = document.getElementById('manual-login-section');
            if (manualSection) {
                manualSection.style.display = 'block';
            }
            
            // 顯示開始遊戲按鈕
            const startBtn = document.getElementById('start-btn');
            if (startBtn) {
                startBtn.style.display = 'inline-block';
            }
        }
        
        // 確保頁面載入完成後函數可用
        document.addEventListener('DOMContentLoaded', function() {
            console.log('✅ 頁面載入完成，LINE 登入函數已準備就緒');
            
            // 確保按鈕可以點擊
            const lineLoginBtn = document.getElementById('line-login-btn');
            if (lineLoginBtn) {
                lineLoginBtn.style.pointerEvents = 'auto';
                lineLoginBtn.style.cursor = 'pointer';
                lineLoginBtn.disabled = false;
                console.log('✅ LINE 登入按鈕已啟用');
            }
        });
    </script>
</body>
</html>
