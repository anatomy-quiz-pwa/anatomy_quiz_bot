services:
  - type: web
    name: anatomy-quiz-bot
    env: python
    rootDir: .
    plan: starter
    buildCommand: |
      pip install -r requirements.txt && \
      python - <<'PY'
      import datetime, subprocess, pathlib
      ts = datetime.datetime.utcnow().strftime("%Y%m%d-%H%M%S")
      try:
          sha = subprocess.check_output(["git","rev-parse","--short","HEAD"]).decode().strip()
      except Exception:
          sha = "no-git"
      pathlib.Path(".build_id").write_text(f"{ts}-{sha}")
      print("Wrote .build_id =", f"{ts}-{sha}")
      PY
    startCommand: gunicorn app_supabase:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /__health
    envVars:
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
