<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}解剖學測驗系統{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Brand Theme -->
    <link href="{{ url_for('static', filename='brand-theme.css') }}" rel="stylesheet">
    <style>
        body {
            background: #F4E8D8;
            background-image: 
                repeating-linear-gradient(
                  0deg,
                  transparent,
                  transparent 2px,
                  rgba(28, 28, 28, 0.02) 2px,
                  rgba(28, 28, 28, 0.02) 4px
                ),
                repeating-linear-gradient(
                  90deg,
                  transparent,
                  transparent 2px,
                  rgba(28, 28, 28, 0.02) 2px,
                  rgba(28, 28, 28, 0.02) 4px
                );
            min-height: 100vh;
            font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
        }
        
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Playfair Display', serif;
            letter-spacing: 0.05em;
        }
        .main-container {
            background: #fffaf5;
            border-radius: 16px;
            border: 3px solid #1C1C1C;
            box-shadow: 8px 8px 0 #1C1C1C;
            margin: 20px auto;
            padding: 30px;
            max-width: 800px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid #1C1C1C;
        }
        .header h1 {
            color: #1C1C1C;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0 #C57B57;
        }
        .header p {
            color: #1C1C1C;
            font-size: 1.1em;
            opacity: 0.85;
        }
        .btn-primary {
            background: #C57B57;
            border: 2px solid #1C1C1C;
            border-radius: 8px;
            padding: 12px 30px;
            font-weight: bold;
            transition: all 0.3s ease;
            color: #fffaf5;
            box-shadow: 3px 3px 0 #1C1C1C;
        }
        .btn-primary:hover {
            background: #B85C38;
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 #1C1C1C;
            color: #fffaf5;
        }
        .btn-success {
            background: #88B04B;
            border: 2px solid #1C1C1C;
            border-radius: 8px;
            padding: 12px 30px;
            font-weight: bold;
            color: #fffaf5;
            box-shadow: 3px 3px 0 #1C1C1C;
        }
        .btn-danger {
            background: #DC3545;
            border: 2px solid #1C1C1C;
            border-radius: 8px;
            padding: 12px 30px;
            font-weight: bold;
            color: #fffaf5;
            box-shadow: 3px 3px 0 #1C1C1C;
        }
        .card {
            border: 2px solid #1C1C1C;
            border-radius: 12px;
            box-shadow: 4px 4px 0 #1C1C1C;
            margin-bottom: 20px;
            background: #fffaf5;
        }
        .card-header {
            background: #C57B57;
            color: #fffaf5;
            border-radius: 10px 10px 0 0 !important;
            border-bottom: 2px solid #1C1C1C;
            font-weight: bold;
        }
        .stats-card {
            background: #B85C38;
            color: #fffaf5;
            border: 2px solid #1C1C1C;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 4px 4px 0 #1C1C1C;
        }
        .level-badge {
            background: #B85C38;
            color: #fffaf5;
            border: 2px solid #1C1C1C;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            box-shadow: 2px 2px 0 #1C1C1C;
        }
        .loading {
            text-align: center;
            padding: 50px;
        }
        .spinner-border {
            color: #667eea;
        }
        .alert {
            border-radius: 15px;
            border: none;
        }
        .quiz-option {
            background: #fffaf5;
            border: 2px solid #1C1C1C;
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 3px 3px 0 #1C1C1C;
        }
        .quiz-option:hover {
            background: #F4E8D8;
            border-color: #1C1C1C;
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 #1C1C1C;
        }
        .quiz-option.selected {
            background: #C57B57;
            color: #fffaf5;
            border-color: #1C1C1C;
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 #1C1C1C;
        }
        .leaderboard-item {
            background: #fffaf5;
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #1C1C1C;
            border-left: 5px solid #C57B57;
            box-shadow: 3px 3px 0 #1C1C1C;
        }
        .rank-1 { border-left-color: #B85C38; }
        .rank-2 { border-left-color: #C57B57; }
        .rank-3 { border-left-color: #1C1C1C; }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-container">
            {% block header %}
            <div class="header">
                <h1><i class="fas fa-heartbeat"></i> 解剖學測驗系統</h1>
                <p>透過LINE登入，挑戰你的解剖學知識！</p>
            </div>
            {% endblock %}
            
            {% block content %}{% endblock %}
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
