<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}解剖學測驗系統{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Brand Theme -->
    <link href="{{ url_for('static', filename='brand-theme.css') }}" rel="stylesheet">
    <style>
        /* 強制覆蓋所有樣式 - Anatomy Bite 品牌風格 */
        html, body {
            background: #F4E8D8 !important;
            background-image: 
                repeating-linear-gradient(
                  0deg,
                  transparent,
                  transparent 2px,
                  rgba(28, 28, 28, 0.02) 2px,
                  rgba(28, 28, 28, 0.02) 4px
                ),
                repeating-linear-gradient(
                  90deg,
                  transparent,
                  transparent 2px,
                  rgba(28, 28, 28, 0.02) 2px,
                  rgba(28, 28, 28, 0.02) 4px
                ) !important;
            background-size: 100% 100% !important;
            background-attachment: fixed !important;
            min-height: 100vh !important;
            font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif !important;
            color: #1C1C1C !important;
            margin: 0 !important;
            padding: 20px !important;
        }
        
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Playfair Display', serif !important;
            letter-spacing: 0.05em !important;
            color: #1C1C1C !important;
        }
        
        /* 遊戲容器樣式 */
        .game-container {
            max-width: 900px !important;
            margin: 0 auto !important;
            background: #fffaf5 !important;
            border: 3px solid #1C1C1C !important;
            box-shadow: 8px 8px 0 #1C1C1C !important;
            border-radius: 16px !important;
            overflow: hidden !important;
        }
        
        /* 遊戲標題區 */
        .game-header {
            background: #C57B57 !important;
            color: #fffaf5 !important;
            border-bottom: 3px solid #1C1C1C !important;
            padding: 30px !important;
            text-align: center;
        }
        
        .game-header h1 {
            color: #fffaf5 !important;
            text-shadow: 2px 2px 0 #1C1C1C !important;
            font-weight: 700 !important;
            margin: 0 !important;
            font-size: 2.5rem !important;
        }
        
        .game-header p {
            color: #fffaf5 !important;
            opacity: 0.95;
        }
        
        /* 遊戲內容區域 */
        .game-content {
            padding: 40px !important;
        }
        
        /* 卡片樣式 */
        .card, .feature-card, .question-card {
            background: #fffaf5 !important;
            border: 2px solid #1C1C1C !important;
            box-shadow: 4px 4px 0 #1C1C1C !important;
            border-radius: 12px !important;
            padding: 2rem !important;
            transition: all 0.3s ease;
            margin: 20px 0 !important;
        }
        
        .card:hover, .feature-card:hover {
            transform: translate(-2px, -2px) !important;
            box-shadow: 6px 6px 0 #1C1C1C !important;
        }
        
        /* 按鈕樣式 */
        button, .action-btn, .btn-primary-custom, .btn {
            background-color: #C57B57 !important;
            color: #fffaf5 !important;
            border: 2px solid #1C1C1C !important;
            border-radius: 8px !important;
            font-weight: bold !important;
            padding: 15px 40px !important;
            font-size: 1.2rem !important;
            cursor: pointer !important;
            transition: all 0.2s ease !important;
            box-shadow: 3px 3px 0 #1C1C1C !important;
            font-family: 'Noto Sans TC', sans-serif !important;
            text-decoration: none !important;
            display: inline-block !important;
        }
        
        button:hover, .action-btn:hover, .btn-primary-custom:hover, .btn:hover {
            background-color: #B85C38 !important;
            transform: translate(-2px, -2px) !important;
            box-shadow: 5px 5px 0 #1C1C1C !important;
            color: #fffaf5 !important;
            text-decoration: none !important;
        }
        
        /* 特殊按鈕樣式 */
        .btn-success {
            background: linear-gradient(135deg, #00C300, #00A000) !important;
        }
        
        .btn-success:hover {
            background: linear-gradient(135deg, #00A000, #008000) !important;
        }
        
        /* 統計欄 */
        .stats-bar {
            display: flex !important;
            justify-content: space-around !important;
            background: #B85C38 !important;
            color: #fffaf5 !important;
            border-bottom: 3px solid #1C1C1C !important;
            padding: 20px !important;
            margin: 0 !important;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 2rem !important;
            font-weight: bold !important;
            color: #fffaf5 !important;
            text-shadow: 1px 1px 0 #1C1C1C !important;
            display: block !important;
        }
        
        .stat-label {
            color: #fffaf5 !important;
            font-size: 0.9rem !important;
            opacity: 0.9;
        }
        
        /* 等級徽章 */
        .level-badge {
            background: #B85C38 !important;
            color: #fffaf5 !important;
            border: 2px solid #1C1C1C !important;
            padding: 8px 16px !important;
            border-radius: 20px !important;
            font-weight: bold !important;
            display: inline-block !important;
            font-size: 0.9rem !important;
            box-shadow: 2px 2px 0 #1C1C1C !important;
        }
        
        /* 輸入框樣式 */
        .form-control {
            border: 2px solid #1C1C1C !important;
            border-radius: 8px !important;
            background: #fffaf5 !important;
            color: #1C1C1C !important;
            padding: 0.75rem !important;
            font-family: 'Noto Sans TC', sans-serif !important;
        }
        
        .form-control:focus {
            border-color: #C57B57 !important;
            box-shadow: 0 0 0 0.2rem rgba(197, 123, 87, 0.25) !important;
            outline: none !important;
        }
        
        /* Alert 樣式 */
        .alert {
            border: 2px solid #1C1C1C !important;
            box-shadow: 3px 3px 0 #1C1C1C !important;
            background: #F4E8D8 !important;
            color: #1C1C1C !important;
            border-radius: 12px !important;
        }
        
        /* 載入動畫 */
        .spinner {
            border: 5px solid #F4E8D8 !important;
            border-top: 5px solid #C57B57 !important;
            border-radius: 50% !important;
            width: 60px !important;
            height: 60px !important;
            animation: spin 1s linear infinite !important;
            margin: 0 auto 20px !important;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 開始畫面 */
        #start-screen {
            text-align: center !important;
            padding: 60px 40px !important;
        }
        
        /* 載入畫面 */
        .loading {
            text-align: center !important;
            padding: 60px !important;
        }
        
        /* 遊戲畫面 */
        #game-screen {
            display: none !important;
        }
        /* 移除重複樣式，使用遊戲容器樣式 */
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid #1C1C1C;
        }
        .header h1 {
            color: #1C1C1C;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0 #C57B57;
        }
        .header p {
            color: #1C1C1C;
            font-size: 1.1em;
            opacity: 0.85;
        }
        .btn-primary {
            background: #C57B57;
            border: 2px solid #1C1C1C;
            border-radius: 8px;
            padding: 12px 30px;
            font-weight: bold;
            transition: all 0.3s ease;
            color: #fffaf5;
            box-shadow: 3px 3px 0 #1C1C1C;
        }
        .btn-primary:hover {
            background: #B85C38;
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 #1C1C1C;
            color: #fffaf5;
        }
        .btn-success {
            background: #88B04B;
            border: 2px solid #1C1C1C;
            border-radius: 8px;
            padding: 12px 30px;
            font-weight: bold;
            color: #fffaf5;
            box-shadow: 3px 3px 0 #1C1C1C;
        }
        .btn-danger {
            background: #DC3545;
            border: 2px solid #1C1C1C;
            border-radius: 8px;
            padding: 12px 30px;
            font-weight: bold;
            color: #fffaf5;
            box-shadow: 3px 3px 0 #1C1C1C;
        }
        .card {
            border: 2px solid #1C1C1C;
            border-radius: 12px;
            box-shadow: 4px 4px 0 #1C1C1C;
            margin-bottom: 20px;
            background: #fffaf5;
        }
        .card-header {
            background: #C57B57;
            color: #fffaf5;
            border-radius: 10px 10px 0 0 !important;
            border-bottom: 2px solid #1C1C1C;
            font-weight: bold;
        }
        .stats-card {
            background: #B85C38;
            color: #fffaf5;
            border: 2px solid #1C1C1C;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 4px 4px 0 #1C1C1C;
        }
        .level-badge {
            background: #B85C38;
            color: #fffaf5;
            border: 2px solid #1C1C1C;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            box-shadow: 2px 2px 0 #1C1C1C;
        }
        .loading {
            text-align: center;
            padding: 50px;
        }
        .spinner-border {
            color: #667eea;
        }
        .alert {
            border-radius: 15px;
            border: none;
        }
        .quiz-option {
            background: #fffaf5;
            border: 2px solid #1C1C1C;
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 3px 3px 0 #1C1C1C;
        }
        .quiz-option:hover {
            background: #F4E8D8;
            border-color: #1C1C1C;
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 #1C1C1C;
        }
        .quiz-option.selected {
            background: #C57B57;
            color: #fffaf5;
            border-color: #1C1C1C;
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 #1C1C1C;
        }
        .leaderboard-item {
            background: #fffaf5;
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #1C1C1C;
            border-left: 5px solid #C57B57;
            box-shadow: 3px 3px 0 #1C1C1C;
        }
        .rank-1 { border-left-color: #B85C38; }
        .rank-2 { border-left-color: #C57B57; }
        .rank-3 { border-left-color: #1C1C1C; }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-container">
            {% block header %}
            <div class="header">
                <h1><i class="fas fa-heartbeat"></i> 解剖學測驗系統</h1>
                <p>透過LINE登入，挑戰你的解剖學知識！</p>
            </div>
            {% endblock %}
            
            {% block content %}{% endblock %}
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
